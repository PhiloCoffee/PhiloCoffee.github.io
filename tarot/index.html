<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=https://philocoffee.github.io/Magic_Tarrow/" />
    <title>Opening PhiloCoffee Tarot Studio</title>
    <meta
      name="description"
      content="Redirecting to PhiloCoffee Tarot Studio, an interactive coffee, philosophy, and tarot reflection tool."
    />
    <link rel="canonical" href="https://philocoffee.github.io/Magic_Tarrow/" />
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1f2522;
        --paper: #f8f5ef;
        --coffee: #5a3825;
        --line: #ddd6ca;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 10%, rgba(196, 150, 58, 0.22), transparent 24rem),
          var(--paper);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(90vw, 34rem);
        padding: 2rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 253, 248, 0.78);
        box-shadow: 0 20px 60px rgba(48, 39, 29, 0.16);
      }

      h1 {
        margin: 0 0 0.75rem;
        color: var(--coffee);
        font-size: clamp(2rem, 7vw, 3.5rem);
        line-height: 0.95;
      }

      p {
        margin: 0 0 1.25rem;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 1rem;
        border-radius: 8px;
        color: #fffaf1;
        background: var(--coffee);
        font-weight: 700;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f1ede3;
          --paper: #171a17;
          --coffee: #c49672;
          --line: #3b4039;
        }

        main {
          background: rgba(23, 26, 23, 0.72);
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.34);
        }

        a {
          color: #171a17;
        }
      }
    </style>
    <script>
      window.location.replace("https://philocoffee.github.io/Magic_Tarrow/");
    </script>
  </head>
  <body>
    <main>
      <h1>Tarot Studio</h1>
      <p>Opening PhiloCoffee Tarot Studio. If nothing happens, use the button below.</p>
      <a href="https://philocoffee.github.io/Magic_Tarrow/">Open Tarot Studio</a>
    </main>
  </body>
</html>
